# Bomber Mod Mixin Configuration for Horizon 26.3

[mixin]
# Client-side only mixins (rendering, input, HUD, UI)
client = [
    "bomber.mods",
    "bomber.key",
    "bomber.command",
    "bomber.settings",
    "bomber.physics",
    "bomber.plane",
    "bomber.bomb",
    "bomber.flight",
    "bomber.ui",
    "bomber.render",
]

# Server-side only mixins (simulation, entity logic, world modification)
server = [
    "bomber.mods",
    "bomber.physics",
    "bomber.plane",
    "bomber.bomb",
]

# Common mixins (shared logic, data structures)
common = []

[hooks]
# API version we're targeting
api_version = 359

# Crate name for generated bindings
crate_name = "bomber"

# Entry points for Horizon to call
entry_points = {
    # Called when mod list opens in Options > Mods
    native_mods = "bomber::mods::native_mods"

    # Key/mouse input handler
    native_key = "bomber::key::native_key"

    # Command handler
    native_command = "bomber::command::native_command"

    # Settings page
    native_settings = "bomber::settings::native_settings"

    # Per-tick update (20 Hz)
    native_tick = "bomber::physics::native_tick"

    # Render callback
    native_render = "bomber::render::native_render"

    # HUD drawing
    native_hud = "bomber::flight::native_hud"

    # Player join/leave
    native_player_join = "bomber::plane::native_player_join"
    native_player_leave = "bomber::plane::native_player_leave"
}

# Feature flags
[features]
# Enable debug logging
debug = false
# Enable physics validation
physics_debug = false
# Enable nuke effects (can be heavy)
nuke_effects = true